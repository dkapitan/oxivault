[project]
name = "oxivault"
version = "0.1.0"
description = "Vault-LD knowledge graph store on object storage"
readme = "README.md"
authors = [
    { name = "Daniel Kapitan", email = "daniel@kapitan.net" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "polars>=1.44.2",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "rdflib>=7.1.0",
]

[project.scripts]
oxivault = "oxivault:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"
fix = true
exclude = ["examples", "docs", "scripts", "src/oxivault/_reference"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",  # do not require copyright notices on every file
    "COM812",  # handled by the formatter
    "ISC001",  # handled by the formatter
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "E501",    # line length is handled by the formatter
    "TD002",   # allow TODOs without an author
    "TD003",   # allow TODOs without an issue link
    "FIX002",  # allow TODO comments to stay
    "TRY003",  # allow long messages in raised exceptions
    "EM101",   # allow string literals in exceptions
    "EM102",   # allow f-string literals in exceptions
    "SIM102",  # nested ifs are sometimes clearer
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"src/oxivault/cli.py" = [
    "FBT001",   # click options pass booleans as positional args
    "FBT002",
]
"tests/**/*.py" = [
    "S101",     # asserts are expected in tests
    "S608",     # test SQL is not user input
    "D100",     # docstrings optional in test modules
    "D103",     # docstrings optional in test functions
    "D104",     # docstrings optional in test packages
    "ANN",      # type hints optional in tests
    "INP001",   # tests are not an importable package
    "PLR2004",  # magic values are fine in test assertions
    "PLR0913",  # fixtures push argument counts up
    "SLF001",   # tests may touch private members
    "ARG001",   # unused fixture arguments are common
    "PLC0415",  # local imports are fine in tests
    "TC001",    # type checking blocks are cumbersome in test files
    "TC002",
    "TC003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
addopts = ["-ra", "-q", "--strict-config", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.ty.rules]
unused-ignore-comment = "warn"
invalid-return-type = "error"
invalid-argument-type = "error"
division-by-zero = "error"
redundant-cast = "warn"
invalid-method-override = "warn"

[tool.uv]
exclude-newer = "14 days"
